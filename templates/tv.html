<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <title>TV Mode - TV Transfer</title>

</head>
<body>

        <h2>رمز الاقتران الخاص بالتلفاز</h2>

        <p id="statusText">بانتظار اتصال الهاتف...</p>

            checkStatus(pin);
        }, 2000);
    </script>
